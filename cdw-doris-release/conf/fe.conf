# JAVA_OPTS
DATE = "$(date +%Y%m%d-%H%M%S)"
LOG_DIR = /data/cdw/doris/fe/log
XMX = 10g
XMS = 8g
# change to use G1GC
JAVA_OPTS="-Djavax.security.auth.useSubjectCredsOnly=false -Xss2m -Xms$XMS -Xmx$XMX -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=50 -XX:MaxHeapFreeRatio=60 -XX:GCPauseIntervalMillis=100 -XX:+PrintGCDateStamps -XX:+PrintGCDetails -XX:+UseGCLogFileRotation -XX:NumberOfGCLogFiles=10 -XX:GCLogFileSize=32M -Xloggc:$LOG_DIR/fe.gc.log.$DATE -Dlog4j2.formatMsgNoLookups=true"
JAVA_OPTS_FOR_JDK_17="-Djavax.security.auth.useSubjectCredsOnly=false -Xss2m -Xms$XMS -Xmx$XMX -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=50 -XX:GCPauseIntervalMillis=100 -Xlog:gc*:file=$LOG_DIR/fe.gc.log.$DATE:time,uptime,level,tags:filecount=10,filesize=32M -Dlog4j2.formatMsgNoLookups=true --add-opens java.base/jdk.internal.module=ALL-UNNAMED"

# port
edit_log_port = 9010
http_port = 8030
query_port = 9030
rpc_port = 9020

# dir
PID_DIR = /data/cdw/doris/fe/pid
audit_log_dir = /data/cdw/doris/fe/log
meta_dir = /data/cdw/doris/fe/meta
sys_log_dir = /data/cdw/doris/fe/log
tmp_dir = /data/cdw/doris/fe/temp_dir

# log
sys_log_level = INFO
sys_log_enable_compress = true
audit_log_enable_compress = true

# balance
balance_slot_num_per_path = 10
schedule_slot_num_per_hdd_path = 10
schedule_slot_num_per_ssd_path = 10
backup_upload_task_num_per_be = 20
restore_download_task_num_per_be = 20

# others
enable_cpu_hard_limit = true
storage_flood_stage_left_capacity_bytes = 10737418240
backup_job_default_timeout_ms = 604800000
